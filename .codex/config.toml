# Generated from .agents SSOT. Do not edit manually; run: py -3 .agents/scripts/sync_agents.py
#
# Project-local Codex MCP and agent runtime configuration.
# Keep secrets out of this file. Set CONTEXT7_API_KEY in the environment.

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800
interrupt_message = true

[features]
goals = true
multi_agent = true

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
env_http_headers = { "CONTEXT7_API_KEY" = "CONTEXT7_API_KEY" }

[mcp_servers.firebase]
command = "npx"
args = ["-y", "firebase-tools@latest", "mcp", "--dir", "."]

[mcp_servers.firebase.env]
IS_FIREBASE_MCP = "true"
